<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestión de pagos | Costumas</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="../styles/gestionMedidas.css">
</head>
<body>
	<aside class="Lateral">
		<img src="../assets/logo-costumas4.png" alt="Logo Costumas" class="LogoMenu">
		<button type="button" onclick="location.href='dashboard.html'"><i class="bi bi-house"></i> Panel principal</button>
		<button type="button" onclick="location.href='gestionClientes.html'"><i class="bi bi-people"></i> Gestión de clientes</button>
		<button type="button" onclick="location.href='gestionMedidas.html'"><i class="bi bi-pencil-square"></i> Gestión de medidas</button>
		<button type="button" onclick="location.href='gestionEncargos.html'"><i class="bi bi-clipboard2-plus"></i> Encargos</button>
		<button type="button" onclick="location.href='gestionEntregas.html'"><i class="bi bi-clipboard2-check"></i> Entregas</button>
		<button class="Activo" type="button" aria-current="page" onclick="location.href='gestionPagos.html'"><i class="bi bi-cash-coin"></i> Pagos</button>
		<button type="button" onclick="location.href='gestionReportes.html'"><i class="bi bi-graph-up-arrow"></i> Reportes</button>
	</aside>

	<main class="ContenidoMedidas">
		<nav class="BarraSuperior" aria-label="Encabezado">
			<div>
				<h1>Gestión de pagos</h1>
				<p>Consulta y administra los pagos de tus clientes</p>
			</div>
			<div class="IconosSuperiores" aria-label="Accesos de usuario">
				<button type="button" aria-label="Configuración"><i class="bi bi-gear"></i></button>
				<button type="button" aria-label="Notificaciones"><i class="bi bi-bell"></i></button>
				<button type="button" aria-label="Perfil"><i class="bi bi-person-circle"></i></button>
			</div>
		</nav>

		<section class="PanelMedidas" aria-label="Estado del módulo">
			<div class="NotaUnidad" role="status">
				<i class="bi bi-tools" aria-hidden="true"></i>
				<p><strong>Módulo en desarrollo</strong><br>La gestión de pagos estará disponible próximamente.</p>
			</div>
		</section>
	</main>
</body>
</html>

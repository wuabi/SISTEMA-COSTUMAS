<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>COSTUMAS - Iniciar Sesión</title>
        <link rel="stylesheet" href="../styles/login.css">
    </head>
    <body>
        <main class="login-shell">
            <div class="login-card">
                <section class="brand-panel">
                    <img src="..\assets\logo-costumas4.png" alt="Logo COSTUMAS" class="logo">
                </section>

                <section class="login-form">
                    <form id="loginForm">
                        <div class="form-header">
                            <h1>Iniciar sesión</h1>
                        </div>

                        <div class="form-group">
                            <label for="username">Correo electrónico</label>
                            <input type="email" id="username" name="username" placeholder="Ingrese su correo" autocomplete="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" autocomplete="current-password" required>
                        </div>

                        <p id="loginMessage" role="alert"></p>

                        <button type="submit" id="btnLogin">Iniciar sesión</button>
                    </form>
                </section>
            </div>
        </main>

        <script src="../controllers/login.js"></script>
    </body>
</html>
